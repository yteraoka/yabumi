name: tagpr

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tagpr:
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN で push したタグでは release ワークフローが起動しないため
      # GitHub App のトークンを使う
      - name: Generate Token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.TAGPR_APP_ID }}
          private-key: ${{ secrets.TAGPR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            yabumi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Run tagpr
        uses: Songmu/tagpr@047aec4b6c0ce166f52958b5a97f5a3d927fd65b # v1.22.0
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
